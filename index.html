function fireball(target=bossTarget||player){if(!boss||!alive||!target)return;const d=boss.position.distanceTo(target.position);if(d>8)return;const key=cycleAttack();console.log('Nezuko attack:',key,'target distance',d);{if(target===player){damagePlayer(49);xSlash(target.position.clone().add(new THREE.Vector3(0,1.25,0)))}else{target.userData.hp=(target.userData.hp??100)-49;xSlash(target.position.clone().add(new THREE.Vector3(0,1.25,0)));if(target.userData.hp<=0){target.position.set((Math.random()-.5)*24,0,(Math.random()-.5)*24);target.userData.hp=100}}burst(target.position.clone().add(new THREE.Vector3(0,1,0)),0xff6a18,70);for(let i=0;i<16;i++){const angle=i*Math.PI/8;const end=boss.position.clone().add(new THREE.Vector3(Math.sin(angle)*45,1,Math.cos(angle)*45));slash(boss.position.clone().add(new THREE.Vector3(0,1.5,0)),end,0xff5412)}}}
function damagePlayer(n){playerHP=Math.max(0,playerHP-n);document.getElementById('playernum').textContent=playerHP+' / 100';document.getElementById('playerbar').style.width=playerHP+'%';if(playerHP<=0){playerHP=100;playerRespawnAt=performance.now()/1000+3;player.position.set(0,0,6);burst(player.position.clone().add(new THREE.Vector3(0,1,0)),0x55ddff,45);document.getElementById('message').textContent='PLAYER RESPAWNING…';}}
function dodge(){if(invuln>0||gameOver)return;invuln=.7;player.position.x+=(Math.random()<.5?-1:1)*1.8;burst(player.position.clone().add(new THREE.Vector3(0,1,0)),0x55ddff,22)}
addEventListener('click',e=>{if(e.target.tagName==='BUTTON'||!alive||gameOver||performance.now()/1000-playerAttackAt<.5)return;playerAttackAt=performance.now()/1000;const d=player.position.distanceTo(boss.position);if(d<4.5){playerRig.attack=1;bossHP=Math.max(0,bossHP-65);cycleAttack();slash(player.position.clone().add(new THREE.Vector3(0,1.5,0)),boss.position.clone().add(new THREE.Vector3(0,1.8,0)));burst(boss.position.clone().add(new THREE.Vector3(0,1.5,0)),0xff75b7,35);if(bossHP===0)killBoss()}});
function killBoss(){alive=false;deadAt=performance.now()/1000;play('die');burst(boss.position.clone().add(new THREE.Vector3(0,1,0)),0xff4b98,100);document.getElementById('message').textContent='NEZUKO DEFEATED';}

let last=performance.now();function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;if(mixer)mixer.update(dt);for(const ally of survivors){ally.userData.attackAnim=Math.max(0,(ally.userData.attackAnim||0)-dt);const bd=boss?ally.position.distanceTo(boss.position):999;ally.userData.attackCooldown-=dt;if(boss&&alive&&bd<19){const v=boss.position.clone().sub(ally.position);v.y=0;const d=v.length();const side=new THREE.Vector3(-v.z,0,v.x).normalize().multiplyScalar(Math.sin(now/700+survivors.indexOf(ally))*4);if(d>3.5){navMove(ally,boss.position,2.5,dt);ally.rotation.y=Math.atan2(v.x,v.z)}else{ally.position.add(side.multiplyScalar(dt));if(ally.userData.attackCooldown<=0){ally.userData.attackCooldown=1;ally.userData.attackAnim=.8;bossHP=Math.max(0,bossHP-12);burst(boss.position.clone().add(new THREE.Vector3(0,1,0)),0x8effc1,12);if(bossHP<=0)killBoss()}}}else{if(!ally.userData.roamPoint||now/1000>ally.userData.roamUntil){ally.userData.roamUntil=now/1000+3;ally.userData.roamPoint=ally.position.clone().add(new THREE.Vector3((Math.random()-.5)*12,0,(Math.random()-.5)*12))}const v=ally.userData.roamPoint.clone().sub(ally.position);v.y=0;if(v.length()>1){navMove(ally,ally.userData.roamPoint,1.4,dt);ally.rotation.y=Math.atan2(v.x,v.z)}}}if(boss)for(const f of fireOrbit){f.angle+=dt*f.speed;f.mesh.position.set(Math.cos(f.angle)*f.radius,f.height+Math.sin(f.angle*2)*.25,Math.sin(f.angle)*f.radius);}if(attackTimer>0){attackTimer-=dt;if(attackTimer<=0&&currentState==='attack'){currentAction=null;currentState='idle';document.getElementById('message').textContent='FIGHT!'}}if(playerRespawnAt&&now/1000>=playerRespawnAt){playerRespawnAt=0;document.getElementById('message').textContent='FIGHT!'}invuln=Math.max(0,invuln-dt);const moveX=Number(!!(keys.d||keys.arrowright))-Number(!!(keys.a||keys.arrowleft)),moveZ=Number(!!(keys.s||keys.arrowdown))-Number(!!(keys.w||keys.arrowup));const forwardX=-Math.sin(yaw),forwardZ=-Math.cos(yaw),rightX=Math.cos(yaw),rightZ=-Math.sin(yaw);const playerMoveX=forwardX*(-moveZ)+rightX*moveX,playerMoveZ=forwardZ*(-moveZ)+rightZ*moveX;if(Math.abs(playerMoveX)+Math.abs(playerMoveZ)>.001){player.rotation.y=Math.atan2(playerMoveX,playerMoveZ)}player.position.x+=playerMoveX*dt*5;player.position.z+=playerMoveZ*dt*5;animateHumanoid(playerRig,Math.abs(moveX)+Math.abs(moveZ)>0,playerRig.attack||0,dt,now/1000);playerRig.attack=Math.max(0,(playerRig.attack||0)-dt*3);for(const ally of survivors)animateHumanoid(ally.userData.rig,!!ally.userData.roamPoint&&ally.position.distanceTo(ally.userData.roamPoint)>1,ally.userData.attackAnim||0,dt,now/1000);updateChunks(player.position);
 if(boss&&alive&&!gameOver){clawRakeClock+=dt;if(clawRakeClock>=14){clawRakeClock=0;for(const victim of [player,...survivors]){clawRake(victim);}}}if(boss){if(attackAt===0){attackAt=now/1000+0.8;}contactDamageClock+=dt;const contactDistance=boss.position.distanceTo(player.position);if(contactDistance<12&&contactDamageClock>=3){contactDamageClock=0;damagePlayer(45);burst(player.position.clone().add(new THREE.Vector3(0,1,0)),0xff438d,45);document.getElementById('message').textContent='NEZUKO HIT YOU! -45 HP';setTimeout(()=>{if(!gameOver)document.getElementById('message').textContent='FIGHT!'},700)}fireTrailClock+=dt;if(fireTrailClock>.12){fireTrailClock=0;leaveFire(boss.position)}// Persistent curved vector steering: no grid, flowfield, or waypoint navigation.
if(dist>3.1){const proxy={position:boss.position,userData:boss.userData};curvedSteer(proxy,targetPos,5.2,dt);boss.rotation.y=Math.atan2(Math.cos(boss.userData.curvedHeading||0),Math.sin(boss.userData.curvedHeading||0));if(currentState!=='walk'&&clips.walk)play('walk');attackTimer=0}
else if(dist<=3.1){boss.rotation.y=Math.atan2(dx,dz);if(now/1000>=attackAt){attackAt=now/1000+BOSS_ATTACK_INTERVAL;fireball(bossTarget)}}

}if(boss&&!alive&&!respawnPending&&now/1000-deadAt>=45){respawnPending=true;alive=true;boss.visible=false;const spawnPoint=findClearSpawn(player.position,25);updateChunks(spawnPoint);boss.position.copy(findClearSpawn(player.position,25));bossHP=15000;document.getElementById('message').textContent='NEZUKO RETURNS';burst(boss.position.clone().add(new THREE.Vector3(0,1,0)),0xff6cae,80);boss.visible=true;play('respawn');setTimeout(()=>{if(alive)play('idle');respawnPending=false},2200)}

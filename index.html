<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nezuko — Boss Fight</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#10060d;color:#fff;font:15px system-ui}canvas{display:block}#hud{position:fixed;inset:16px 16px auto;display:flex;justify-content:space-between;gap:12px;pointer-events:none} .panel{background:#170b18d9;border:1px solid #ff8ab855;border-radius:12px;padding:12px 16px;min-width:220px;backdrop-filter:blur(8px)}.label{font-size:12px;letter-spacing:2px;color:#ffb2d0}.bar{height:12px;background:#38202e;border-radius:8px;overflow:hidden;margin-top:7px}.fill{height:100%;width:100%;background:linear-gradient(90deg,#ff3c79,#ffb0d1);transition:width .15s}.player .fill{background:linear-gradient(90deg,#42d7ff,#b4f8ff)}#help{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#170b18dd;padding:12px 18px;border:1px solid #ff8ab855;border-radius:12px;text-align:center;white-space:nowrap}#message{position:fixed;inset:45% 0 auto;text-align:center;font-size:clamp(24px,5vw,54px);font-weight:900;text-shadow:0 0 24px #ff287a;pointer-events:none}button{pointer-events:auto;background:#ff4d91;border:0;color:white;padding:9px 14px;border-radius:8px;font-weight:700;cursor:pointer}
</style></head><body>
<div id="hud"><div class="panel"><div class="label">NEZUKO • DEMON</div><div class="bar"><div id="bossbar" class="fill"></div></div><small id="bossnum">1000 / 1000</small></div><div class="panel player"><div class="label">PLAYER</div><div class="bar"><div id="playerbar" class="fill"></div></div><small id="playernum">100 / 100</small></div></div>
<div id="message">FIGHT!</div><div id="help">WASD move · Mouse click attack · Space dodge <button id="restart">Restart</button></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {AnimationMixer} from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x100611);scene.fog=new THREE.Fog(0x100611,18,48);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,100);camera.position.set(0,8,13);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffc5df,0x24102d,2));const sun=new THREE.DirectionalLight(0xffb5d6,3);sun.position.set(5,12,7);sun.castShadow=true;scene.add(sun);
const floor=new THREE.Mesh(new THREE.CircleGeometry(22,64),new THREE.MeshStandardMaterial({color:0x28152b,roughness:.8}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const grid=new THREE.GridHelper(44,44,0x6d315d,0x3a2040);grid.position.y=.012;scene.add(grid);
const arena=new THREE.Mesh(new THREE.RingGeometry(8.8,9,96),new THREE.MeshBasicMaterial({color:0xff438c,transparent:true,opacity:.35,side:THREE.DoubleSide}));arena.rotation.x=-Math.PI/2;arena.position.y=.02;scene.add(arena);
document.getElementById('message').textContent='LOADING ARENA…';
let boss, mixer, clips={}, currentAction, bossHP=1000,playerHP=100,alive=true,deadAt=0,attackAt=0,playerAttackAt=0,invuln=0,gameOver=false,attackTimer=0,respawnPending=false;
const player=new THREE.Group();scene.add(player);player.position.set(0,0,5);
const pbody=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.9,4,8),new THREE.MeshStandardMaterial({color:0x38c9ed,emissive:0x073344}));pbody.position.y=1;player.add(pbody);
const phead=new THREE.Mesh(new THREE.SphereGeometry(.32,16,12),new THREE.MeshStandardMaterial({color:0x9cecff}));phead.position.y=1.85;player.add(phead);
const aura=new THREE.Mesh(new THREE.TorusGeometry(.75,.07,8,32),new THREE.MeshBasicMaterial({color:0xff69b2}));aura.rotation.x=Math.PI/2;aura.position.y=.1;player.add(aura);
let bossAura;
const loader=new GLTFLoader();loader.load('./succubus_boss_for_model_engine.glb',g=>{
 boss=new THREE.Group();const model=g.scene;model.scale.setScalar(1.5);model.rotation.y=Math.PI;boss.add(model);boss.position.set(0,0,-2);boss.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});scene.add(boss);
 mixer=new AnimationMixer(boss);clips=g.animations;
 const names=clips.map(c=>c.name);console.log('GLB animation clips:',names);
 function find(pattern){return clips.find(c=>pattern.test(c.name.toLowerCase()))}
const attackClips=clips.filter(c=>/attack|atk|slash|strike|combo|skill|hit|cast/i.test(c.name));let attackCycle=0;const attackActions=attackClips.map(c=>mixer.clipAction(c));
 clips.idle=find(/idle|stand|breath/);clips.walk=find(/walk|run|move/);clips.attack=find(/attack|slash|hit|cast/);clips.die=find(/die|death|dead/);clips.respawn=find(/respawn|revive|rise|appear/);
 play('idle');
 bossAura=new THREE.Mesh(new THREE.TorusGeometry(1.15,.08,8,40),new THREE.MeshBasicMaterial({color:0xff3988,transparent:true,opacity:.65}));bossAura.rotation.x=Math.PI/2;bossAura.position.y=.12;boss.add(bossAura);const fireHalo=new THREE.Mesh(new THREE.TorusGeometry(1.35,.18,10,48),new THREE.MeshBasicMaterial({color:0xff4b13,transparent:true,opacity:.8}));fireHalo.rotation.x=Math.PI/2;fireHalo.position.y=.18;boss.add(fireHalo);const fireLight=new THREE.PointLight(0xff4a0a,3,7);fireLight.position.y=1.2;boss.add(fireLight);document.getElementById('message').textContent='FIGHT!';
},undefined,e=>{console.error(e);document.getElementById('message').textContent='MODEL LOAD FAILED';});
function cycleAttack(){if(!mixer||!attackActions.length){console.warn('No attack clips detected:',clips.map(c=>c.name));return}const a=attackActions[attackCycle++%attackActions.length];mixer.stopAllAction();a.reset();a.setLoop(THREE.LoopOnce,1);a.clampWhenFinished=true;a.fadeIn(.08);a.play();currentAction=a;console.log('Attack animation:',a.getClip().name)}
function play(key){if(!mixer||!clips[key])return;const a=mixer.clipAction(clips[key]);if(currentAction===a)return;a.reset();a.setLoop(key==='die'?THREE.LoopOnce:THREE.LoopRepeat,key==='die'?1:Infinity);a.clampWhenFinished=key==='die';a.fadeIn(.15);if(currentAction)currentAction.fadeOut(.12);a.play();currentAction=a}
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')dodge()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function face(obj,target){const yaw=Math.atan2(target.x-obj.position.x,target.z-obj.position.z);obj.rotation.y=yaw;}
function burst(pos,color=0xff4c9a,count=60){const geo=new THREE.BufferGeometry(),arr=new Float32Array(count*3),vel=[];for(let i=0;i<count;i++){arr[i*3]=pos.x;arr[i*3+1]=pos.y;arr[i*3+2]=pos.z;vel.push(new THREE.Vector3((Math.random()-.5)*5,Math.random()*5,(Math.random()-.5)*5))}geo.setAttribute('position',new THREE.BufferAttribute(arr,3));const mat=new THREE.PointsMaterial({color,size:.13,transparent:true,opacity:1,blending:THREE.AdditiveBlending,depthWrite:false});const pts=new THREE.Points(geo,mat);scene.add(pts);let t=0;effects.push(dt=>{t+=dt;const a=geo.attributes.position;for(let i=0;i<count;i++){a.array[i*3]+=vel[i].x*dt;a.array[i*3+1]+=vel[i].y*dt-2*dt*t;a.array[i*3+2]+=vel[i].z*dt}a.needsUpdate=true;mat.opacity=Math.max(0,1-t/1.1);if(t>1.1){scene.remove(pts);geo.dispose();mat.dispose();return true}})}
const effects=[];let fireTrailClock=0;function leaveFire(pos){const flame=new THREE.Mesh(new THREE.ConeGeometry(.22,.65,7),new THREE.MeshBasicMaterial({color:Math.random()<.5?0xff4b16:0xffb52e,transparent:true,opacity:.9}));flame.position.set(pos.x,.32,pos.z);flame.rotation.z=(Math.random()-.5)*.5;scene.add(flame);let t=0;effects.push(dt=>{t+=dt;flame.position.y=.32+t*.45;flame.scale.multiplyScalar(1-dt*.7);flame.material.opacity=Math.max(0,.9-t/1.1);if(t>1.1){scene.remove(flame);flame.geometry.dispose();flame.material.dispose();return true}})}
function slash(from,to,color=0xff63ae){const curve=new THREE.QuadraticBezierCurve3(from,new THREE.Vector3((from.x+to.x)/2,2.6,(from.z+to.z)/2),to);const mesh=new THREE.Mesh(new THREE.TubeGeometry(curve,20,.09,8,false),new THREE.MeshBasicMaterial({color,transparent:true,opacity:1}));scene.add(mesh);let t=0;effects.push(dt=>{t+=dt;mesh.material.opacity=1-t/.35;if(t>.35){scene.remove(mesh);mesh.geometry.dispose();mesh.material.dispose();return true}})}
function fireball(){if(!boss||!alive||gameOver)return;cycleAttack();const start=boss.position.clone().add(new THREE.Vector3(0,1.6,0)),end=player.position.clone().add(new THREE.Vector3(0,1,0));slash(start,end,0xff4215);damagePlayer(45);burst(player.position.clone().add(new THREE.Vector3(0,1,0)),0xff438d,45);}
function damagePlayer(n){playerHP=Math.max(0,playerHP-n);if(!playerHP){gameOver=true;document.getElementById('message').textContent='YOU WERE DEFEATED';}}
function dodge(){if(invuln>0||gameOver)return;invuln=.7;player.position.x+=(Math.random()<.5?-1:1)*1.8;burst(player.position.clone().add(new THREE.Vector3(0,1,0)),0x55ddff,22)}
addEventListener('click',e=>{if(e.target.tagName==='BUTTON'||!alive||gameOver||performance.now()/1000-playerAttackAt<.5)return;playerAttackAt=performance.now()/1000;const d=player.position.distanceTo(boss.position);if(d<4.5){bossHP=Math.max(0,bossHP-65);cycleAttack();slash(player.position.clone().add(new THREE.Vector3(0,1.5,0)),boss.position.clone().add(new THREE.Vector3(0,1.8,0)));burst(boss.position.clone().add(new THREE.Vector3(0,1.5,0)),0xff75b7,35);if(bossHP===0)killBoss()}});
function killBoss(){alive=false;deadAt=performance.now()/1000;play('die');burst(boss.position.clone().add(new THREE.Vector3(0,1,0)),0xff4b98,100);document.getElementById('message').textContent='NEZUKO DEFEATED';}
document.getElementById('restart').onclick=()=>location.reload();
let last=performance.now();function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;if(mixer)mixer.update(dt);invuln=Math.max(0,invuln-dt);player.position.x+=(Number(!!(keys.d||keys.arrowright))-Number(!!(keys.a||keys.arrowleft)))*dt*5;player.position.z+=(Number(!!(keys.s||keys.arrowdown))-Number(!!(keys.w||keys.arrowup)))*dt*5;player.position.x=THREE.MathUtils.clamp(player.position.x,-8,8);player.position.z=THREE.MathUtils.clamp(player.position.z,-8,8);
 if(boss&&alive&&!gameOver){fireTrailClock+=dt;if(fireTrailClock>.12){fireTrailClock=0;leaveFire(boss.position)}face(boss,player.position);if(now/1000>attackAt){attackAt=now/1000+3;fireball()}if(boss.position.distanceTo(player.position)>3.5){boss.position.x+=(player.position.x-boss.position.x)*dt*.45;boss.position.z+=(player.position.z-boss.position.z)*dt*.45;if(!currentAction||currentAction===mixer.clipAction(clips.walk))play('walk')}}}
 if(boss&&!alive&&!respawnPending&&now/1000-deadAt>=45){respawnPending=true;alive=true;boss.visible=false;boss.position.set(0,0,-2);bossHP=1000;document.getElementById('message').textContent='NEZUKO RETURNS';burst(boss.position.clone().add(new THREE.Vector3(0,1,0)),0xff6cae,80);boss.visible=true;play('respawn');setTimeout(()=>{if(alive)play('idle');respawnPending=false},2200)}
 for(let i=effects.length-1;i>=0;i--)if(effects[i](dt))effects.splice(i,1);
 document.getElementById('bossbar').style.width=bossHP/10+'%';document.getElementById('bossnum').textContent=bossHP+' / 1000';document.getElementById('playerbar').style.width=playerHP+'%';document.getElementById('playernum').textContent=playerHP+' / 100';
 camera.position.x+=(player.position.x-camera.position.x)*dt*.4;camera.lookAt(player.position.x,0,0);renderer.render(scene,camera)}
requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
